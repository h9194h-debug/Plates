<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>أسعار اللوحات</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #f2f2f7; color: #000; }
  h2 { margin-top: 24px; }
  input, button, textarea, select { font-size: 16px; padding: 10px; margin: 4px 0; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; }
  button { background: #007aff; color: #fff; border: none; }
  .card { background: #fff; padding: 12px; margin: 8px 0; border-radius: 10px; }
  .pattern { font-weight: bold; font-size: 18px; direction: ltr; text-align: right; }
  .del { background: #ff3b30; width: auto; padding: 4px 10px; font-size: 13px; }
  textarea, #search { direction: ltr; }
  .hint { color: #666; font-size: 13px; }
</style>
</head>
<body>

<h2>بحث</h2>
<input id="search" placeholder="نمط XXYYZ أو رقم 61600 أو حرف R" oninput="render()">
<select id="patternPick" onchange="pickPattern()"></select>
<div class="hint">تقدر تكتب أكثر من شي مع بعض، مثل: R XXYYZ</div>
<div id="summary" class="card"></div>

<h2>الأنماط</h2>
<div id="patterns"></div>

<h2>كل المبيعات</h2>
<div id="list"></div>

<h2>استيراد من الملاحظات</h2>
<textarea id="bulk" rows="6" placeholder="الصق القائمة هنا"></textarea>
<button onclick="importBulk()">استيراد</button>

<h2>إضافة لوحة مباعة</h2>
<input id="code" maxlength="2" placeholder="حرف الفئة مثل R" style="direction:ltr">
<input id="num" type="number" inputmode="numeric" placeholder="رقم اللوحة مثل 11223">
<input id="price" type="number" inputmode="numeric" placeholder="سعر البيع مثل 4500">
<input id="date" type="date">
<button onclick="addSale()">حفظ</button>

<script>
let sales = JSON.parse(localStorage.getItem("sales") || "[]");

function save() { localStorage.setItem("sales", JSON.stringify(sales)); }

function getPattern(n) {
  const letters = "XYZABCDEFGHIJKLMNOPQRSTUVW";
  const map = {};
  let out = "";
  for (const d of String(n)) {
    if (!(d in map)) map[d] = letters[Object.keys(map).length];
    out += map[d];
  }
  return out;
}

  const code = document.getElementById("code").value.trim().toUpperCase();
  const num = document.getElementById("num").value.trim();
  const price = Number(document.getElementById("price").value);
  const date = document.getElementById("date").value;
