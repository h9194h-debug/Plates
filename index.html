إضافة لوحة مباعة
<input id="code" maxlength="2" placeholder="حرف الفئة مثل R" style="direction:ltr">
<input id="num" type="number" inputmode="numeric" placeholder="رقم اللوحة مثل 11223">
<input id="price" type="number" inputmode="numeric" placeholder="سعر البيع مثل 4500">
<input id="date" type="date">


<script>
let sales = JSON.parse(localStorage.getItem("sales") || "[]");

function save() { localStorage.setItem("sales", JSON.stringify(sales)); }

function getPattern(n) {
  const letters = "XYZABCDEFGHIJKLMNOPQRSTUVW";
  const map = {};
  let out = "";
  for (const d of String(n)) {
    if (!(d in map)) map[d] = letters[Object.keys(map).length];
    out += map[d];
  }
  return out;
}

function addSale() {
  const code = document.getElementById("code").value.trim().toUpperCase();
  const num = document.getElementById("num").value.trim();
  const price = Number(document.getElementById("price").value);
  const date = document.getElementById("date").value;
  if (!num || !price) return alert("عبّ الرقم والسعر");
  sales.push({ code, num, price, date });
  save();
  document.getElementById("num").value = "";
  document.getElementById("price").value = "";
  render();
}

function removeSale(i) { sales.splice(i, 1); save(); render(); }

function importBulk() {
  const text = document.getElementById("bulk").value;
  let added = 0, skipped = 0;
  const skippedLines = [];
  text.split("\n").forEach(line => {
    line = line.trim();
    if (!line) return;
    const pm = line.match(/(\d+(?:\.\d+)?)\s*k/i);
    const lm = line.match(/([A-Za-z])\s*(\d{1,5})\b/);
    if (!pm || !lm) { skipped++; skippedLines.push(line); return; }
    sales.push({ code: lm[1].toUpperCase(), num: lm[2], price: Math.round(parseFloat(pm[1]) * 1000), date: "" });
    added++;
  });
  save();
  document.getElementById("bulk").value = skippedLines.join("\n");
  render();
  alert("تمت إضافة " + added + " لوحة" + (skipped ? "، وتخطيت " + skipped + " سطر" : ""));
}

function matches(s, q) {
  if (!q) return true;
  const pattern = getPattern(s.num);
  const code = (s.code || "").toUpperCase();
  return q.split(/\s+/).filter(Boolean).every(t => {
    if (/^\d+$/.test(t)) return String(s.num).includes(t);
    if (t.length === 1 && /^[A-Z]$/.test(t)) return code === t;
    return pattern.includes(t);
  });
}

function render() {
  fillPatternMenu();
  const q = document.getElementById("search").value.trim().toUpperCase();
  const filtered = sales.map((s, i) => ({ s, i })).filter(x => matches(x.s, q));
  const prices = filtered.map(x => x.s.price);
  const summary = document.getElementById("summary");
  if (q && prices.length) {
    const avg = Math.round(prices.reduce((a, b) => a + b, 0) / prices.length);
    summary.innerHTML = `النتائج: ${prices.length} لوحة | متوسط: ${avg.toLocaleString()} أقل: ${Math.min(...prices).toLocaleString()} | أعلى: ${Math.max(...prices).toLocaleString()}`;
  } else if (q) {
    summary.innerHTML = "ما لقيت نتائج";
  } else {
    summary.innerHTML = `إجمالي اللوحات: ${sales.length}`;
  }

  const groups = {};
  filtered.forEach(x => { const p = getPattern(x.s.num); (groups[p] = groups[p] || []).push(x.s.price); });

  document.getElementById("patterns").innerHTML = Object.entries(groups)
    .sort((a, b) => b[1].length - a[1].length)
    .map(([p, arr]) => {
      const avg = Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
      return ` ${p}
        عدد: ${arr.length} | متوسط: ${avg.toLocaleString()}
        أقل: ${Math.min(...arr).toLocaleString()} | أعلى: ${Math.max(...arr).toLocaleString()} `;
    }).join("") || "لا يوجد";

  document.getElementById("list").innerHTML = filtered.map(x => {
    const s = x.s;
    return ` `;
  }).join("");
}
render();
